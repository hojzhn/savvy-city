# Family and household tables (spec step 3). STARTING VALUES FOR TUNING:
# the weights are rough guesses, not researched rates.
#
# Groups roll in order, and items roll in order within a group. An item can
# only read facts produced above it; the loader rejects anything else.
#
# Item fields
#   values:    possible outcomes, in order
#   weights:   base weight per value (values left out weigh 1)
#   base_from: take base weights from the location's share map (groups, religions)
#   only_if:   roll only when these hold; otherwise use default
#   assort:    per-parent items only: chance the father copies the mother's value
#   mods:      each mod multiplies weights when ALL its `when` conditions hold
#
# Condition keys
#   year                     birth year (numeric)
#   pawn.sex, pawn.<trait>   sex and temperament (traits are 0-1 percentiles)
#   context.<field>          step 2 values
#   self.<item>              the parent being rolled (per-parent groups only)
#   mother.<item>, father.<item>, any_parent.<item>
#   parents.same.<item>      yes/no: do both parents have the same value
#   <group>.<item>           an earlier non-parent item
#
# Condition values
#   [a, b]  one of these     a  exactly this     "!a"  anything but this
#   ">=0.7", "<1990", "1990..1999"  numeric comparisons
#
# Any group, item or mod can carry a `note:` explaining it. Use notes rather
# than comments below this header: the Traits editor in the game rewrites
# this file when it saves, keeping this header and notes but not comments.

groups:

  # ----------------------------------------------------------------- parents
  - name: parents
    per_parent: true
    items:

      - id: ethnicity
        values: [white, black, hispanic, asian, other]
        base_from: groups
        assort: 0.75

      - id: immigrant_generation
        values: [third_plus, second, gen_1_5, first]
        weights: { third_plus: 70, second: 12, gen_1_5: 6, first: 12 }
        assort: 0.6
        mods:
          - when: { self.ethnicity: asian }
            mul: { third_plus: 0.25, second: 2, gen_1_5: 2, first: 4 }
          - when: { self.ethnicity: hispanic }
            mul: { third_plus: 0.6, second: 1.5, gen_1_5: 1.5, first: 2.5 }
          - when: { self.ethnicity: black }
            mul: { third_plus: 1.3, first: 0.6 }
          - when: { context.diversity: highly_diverse }
            mul: { first: 1.5, gen_1_5: 1.3 }
          - when: { context.diversity: [homogeneous, mostly_homogeneous] }
            mul: { first: 0.4, gen_1_5: 0.5, second: 0.6 }

      - id: languages_at_home
        values: [local_only, bilingual, heritage_only]
        weights: { local_only: 90, bilingual: 8, heritage_only: 2 }
        mods:
          - when: { self.immigrant_generation: first }
            mul: { local_only: 0.1, bilingual: 5, heritage_only: 15 }
          - when: { self.immigrant_generation: gen_1_5 }
            mul: { local_only: 0.4, bilingual: 6, heritage_only: 2 }
          - when: { self.immigrant_generation: second }
            mul: { bilingual: 3 }

      - id: education
        values: [none, primary, some_secondary, secondary, trade, some_college, bachelors, masters, doctorate_professional]
        weights: { none: 1, primary: 2, some_secondary: 10, secondary: 30, trade: 10, some_college: 20, bachelors: 18, masters: 7, doctorate_professional: 2 }
        assort: 0.4
        mods:
          - when: { year: "<1990" }
            mul: { bachelors: 0.8, masters: 0.7, doctorate_professional: 0.8, some_secondary: 1.3 }
          - when: { self.immigrant_generation: first }
            mul: { none: 4, primary: 4, some_secondary: 1.5, doctorate_professional: 1.5 }
          - when: { context.urbanicity: urban_core }
            mul: { bachelors: 1.4, masters: 1.5, doctorate_professional: 1.6 }
          - when: { context.urbanicity: [small_town, rural] }
            mul: { bachelors: 0.6, masters: 0.5, doctorate_professional: 0.5, trade: 1.4, secondary: 1.2 }

      - id: occupation
        values: [unemployed, homemaker, informal_work, unskilled_labor, skilled_trade, service, clerical, agriculture, military, public_sector, small_business, creative, professional, academic, manager_executive]
        weights: { unemployed: 4, homemaker: 6, informal_work: 2, unskilled_labor: 10, skilled_trade: 10, service: 12, clerical: 10, agriculture: 2, military: 2, public_sector: 9, small_business: 7, creative: 3, professional: 10, academic: 1, manager_executive: 6 }
        mods:
          - when: { self.role: mother }
            mul: { homemaker: 4, skilled_trade: 0.2, military: 0.2, unskilled_labor: 0.6, clerical: 1.8, agriculture: 0.5 }
          - when: { self.role: father }
            mul: { homemaker: 0.08, clerical: 0.6 }
          - when: { self.role: mother, context.norms_gender: traditional }
            mul: { homemaker: 2 }
          - when: { self.education: [none, primary, some_secondary] }
            mul: { professional: 0.05, academic: 0, manager_executive: 0.2, public_sector: 0.4, clerical: 0.5, unskilled_labor: 2.5, informal_work: 2, unemployed: 1.8 }
          - when: { self.education: secondary }
            mul: { professional: 0.2, academic: 0, manager_executive: 0.6 }
          - when: { self.education: trade }
            mul: { skilled_trade: 5, professional: 0.3, academic: 0 }
          - when: { self.education: some_college }
            mul: { academic: 0.1, clerical: 1.4 }
          - when: { self.education: bachelors }
            mul: { professional: 3, manager_executive: 2, public_sector: 1.5, unskilled_labor: 0.3, academic: 0.5 }
          - when: { self.education: [masters, doctorate_professional] }
            mul: { professional: 4, academic: 8, manager_executive: 2.5, unskilled_labor: 0.1, service: 0.3, informal_work: 0.2 }
          - when: { context.urbanicity: rural }
            mul: { agriculture: 6, creative: 0.4 }
          - when: { context.economic_era: [recession, crisis] }
            mul: { unemployed: 2 }

      - id: religion
        values: [none, spiritual, catholic, mainline_protestant, evangelical, orthodox, latter_day_saint, jewish, muslim, hindu, buddhist, sikh, folk_other]
        base_from: religions
        assort: 0.85
        mods:
          - when: { self.ethnicity: hispanic }
            mul: { catholic: 3, evangelical: 1.3 }
          - when: { self.ethnicity: black }
            mul: { evangelical: 2.5, mainline_protestant: 1.5, catholic: 0.4, muslim: 1.5, jewish: 0.2 }
          - when: { self.ethnicity: asian }
            mul: { hindu: 6, buddhist: 6, sikh: 5, none: 1.3, evangelical: 0.7 }
          - when: { self.ethnicity: white }
            mul: { hindu: 0.05, sikh: 0.02, buddhist: 0.3, muslim: 0.3 }
          - when: { self.education: [masters, doctorate_professional] }
            mul: { none: 1.5, evangelical: 0.6 }
          - when: { year: ">=1995" }
            mul: { none: 1.3 }

      - id: practice
        values: [none, nominal, holidays_only, regular, devout, strict]
        weights: { none: 0, nominal: 25, holidays_only: 25, regular: 25, devout: 15, strict: 3 }
        only_if: { self.religion: "!none" }
        default: none
        mods:
          - when: { self.religion: spiritual }
            mul: { nominal: 2, regular: 0.3, devout: 0.3, strict: 0 }
          - when: { self.religion: [evangelical, latter_day_saint] }
            mul: { regular: 1.5, devout: 2 }
          - when: { self.religion: [muslim, sikh, orthodox] }
            mul: { devout: 1.5, strict: 2 }
          - when: { context.norms_sex: restrictive }
            mul: { devout: 1.5, nominal: 0.7 }
          - when: { year: ">=1995" }
            mul: { nominal: 1.3, devout: 0.8 }

      - id: age_at_birth
        values: [under_20, 20_24, 25_29, 30_34, 35_39, 40_plus]
        weights: { under_20: 6, 20_24: 24, 25_29: 32, 30_34: 24, 35_39: 10, 40_plus: 4 }
        assort: 0.5
        mods:
          - when: { self.role: father }
            mul: { under_20: 0.3, 20_24: 0.7, 30_34: 1.3, 35_39: 1.6, 40_plus: 2.2 }
          - when: { year: ">=1995" }
            mul: { under_20: 0.7, 20_24: 0.8, 30_34: 1.2, 35_39: 1.4, 40_plus: 1.4 }
          - when: { self.education: [bachelors, masters, doctorate_professional] }
            mul: { under_20: 0.2, 20_24: 0.5, 30_34: 1.5, 35_39: 1.7 }
          - when: { self.practice: [devout, strict] }
            mul: { under_20: 1.5, 20_24: 1.5, 35_39: 0.8 }

      - id: mental_health_severity
        values: [stable, mild, moderate, severe]
        weights: { stable: 70, mild: 18, moderate: 9, severe: 3 }

      - id: mental_health_type
        values: [none, anxiety, depression, bipolar, personality_traits, psychotic, trauma]
        weights: { none: 0, anxiety: 35, depression: 35, bipolar: 7, personality_traits: 8, psychotic: 3, trauma: 12 }
        only_if: { self.mental_health_severity: "!stable" }
        default: none
        mods:
          - when: { self.mental_health_severity: severe }
            mul: { psychotic: 4, bipolar: 3, personality_traits: 2 }

      - id: mental_health_treatment
        values: [none, untreated, treated]
        weights: { none: 0, untreated: 60, treated: 40 }
        only_if: { self.mental_health_severity: "!stable" }
        default: none
        mods:
          - when: { year: ">=1995" }
            mul: { treated: 1.4 }
          - when: { self.education: [bachelors, masters, doctorate_professional] }
            mul: { treated: 1.5 }

      - id: substance_use
        values: [none, social_drinking, heavy_drinking, alcohol_dependence, recreational_drugs, drug_dependence, in_recovery]
        weights: { none: 30, social_drinking: 45, heavy_drinking: 9, alcohol_dependence: 5, recreational_drugs: 6, drug_dependence: 2, in_recovery: 3 }
        mods:
          - when: { self.mental_health_severity: [moderate, severe] }
            mul: { heavy_drinking: 2, alcohol_dependence: 2.5, recreational_drugs: 1.5, drug_dependence: 3 }
          - when: { self.religion: [muslim, latter_day_saint] }
            mul: { none: 5, social_drinking: 0.2 }
          - when: { self.practice: [devout, strict] }
            mul: { none: 3, recreational_drugs: 0.3 }
          - when: { context.urbanicity: urban_core }
            mul: { recreational_drugs: 1.5 }
          - when: { self.role: mother }
            mul: { heavy_drinking: 0.5, alcohol_dependence: 0.4, drug_dependence: 0.5 }

  # --------------------------------------------------------------- household
  - name: household
    items:

      - id: politics_leaning
        values: [far_left, left, center_left, center, center_right, right, far_right, apolitical]
        weights: { far_left: 2, left: 10, center_left: 15, center: 15, center_right: 15, right: 10, far_right: 2, apolitical: 20 }
        mods:
          - when: { context.local_politics: strongly_left }
            mul: { far_left: 2.5, left: 2, center_left: 1.5, center_right: 0.6, right: 0.4, far_right: 0.3 }
          - when: { context.local_politics: left_leaning }
            mul: { left: 1.4, center_left: 1.3, right: 0.7 }
          - when: { context.local_politics: right_leaning }
            mul: { right: 1.4, center_right: 1.3, left: 0.7 }
          - when: { context.local_politics: strongly_right }
            mul: { far_right: 2.5, right: 2, center_right: 1.5, center_left: 0.6, left: 0.4, far_left: 0.3 }
          - when: { any_parent.religion: [evangelical, latter_day_saint] }
            mul: { right: 2, far_right: 2, center_right: 1.5, left: 0.5, far_left: 0.3 }
          - when: { any_parent.practice: [devout, strict] }
            mul: { right: 1.5, center_right: 1.2, left: 0.7 }
          - when: { any_parent.religion: none }
            mul: { left: 1.4, center_left: 1.2, right: 0.6 }
          - when: { any_parent.education: [masters, doctorate_professional] }
            mul: { left: 1.5, center_left: 1.4, apolitical: 0.7, right: 0.7 }
          - when: { any_parent.ethnicity: black }
            mul: { left: 2, center_left: 1.5, right: 0.4, far_right: 0.1 }

      - id: politics_engagement
        values: [none, casual, engaged, activist]
        weights: { none: 0, casual: 55, engaged: 35, activist: 10 }
        only_if: { household.politics_leaning: "!apolitical" }
        default: none
        mods:
          - when: { household.politics_leaning: [far_left, far_right] }
            mul: { casual: 0.4, engaged: 1.5, activist: 3 }

      - id: politics_agreement
        values: [agree, split]
        weights: { agree: 80, split: 20 }
        only_if: { household.politics_leaning: "!apolitical" }
        default: agree
        mods:
          - when: { parents.same.religion: "no" }
            mul: { split: 2.5 }
          - when: { parents.same.education: "no" }
            mul: { split: 1.3 }

      - id: wealth
        values: [poverty, working_class, lower_middle, upper_middle, affluent, wealthy]
        weights: { poverty: 12, working_class: 28, lower_middle: 28, upper_middle: 20, affluent: 9, wealthy: 3 }
        mods:
          - when: { any_parent.occupation: [professional, manager_executive, academic] }
            mul: { upper_middle: 2.5, affluent: 3, wealthy: 3, poverty: 0.2, working_class: 0.4 }
          - when: { any_parent.occupation: manager_executive }
            mul: { wealthy: 2 }
          - when: { any_parent.occupation: small_business }
            mul: { affluent: 1.3, wealthy: 1.5 }
          - when: { any_parent.occupation: [unskilled_labor, informal_work, service] }
            mul: { poverty: 1.6, working_class: 1.6, upper_middle: 0.5, affluent: 0.2, wealthy: 0.1 }
          - when: { any_parent.occupation: unemployed }
            mul: { poverty: 2.5, affluent: 0.3, wealthy: 0.3 }
          - when: { context.urbanicity: rural }
            mul: { affluent: 0.6, wealthy: 0.5 }
          - when: { context.economic_era: [recession, crisis] }
            mul: { poverty: 1.4 }

      - id: marriage_quality
        values: [warm_stable, cold_stable, strained, high_conflict, separated]
        weights: { warm_stable: 35, cold_stable: 20, strained: 22, high_conflict: 13, separated: 10 }
        mods:
          - when: { any_parent.mental_health_severity: [moderate, severe] }
            mul: { warm_stable: 0.5, high_conflict: 2, separated: 1.6 }
          - when: { any_parent.substance_use: [heavy_drinking, alcohol_dependence, drug_dependence] }
            mul: { warm_stable: 0.3, high_conflict: 3, separated: 2 }
          - when: { household.wealth: poverty }
            mul: { strained: 1.5, high_conflict: 1.5, separated: 1.5 }
          - when: { household.wealth: [affluent, wealthy] }
            mul: { warm_stable: 1.2, cold_stable: 1.3 }

      - id: shape
        values: [two_parents, single_mother, single_father, blended, grandparents, extended_family, foster, adoptive]
        weights: { two_parents: 72, single_mother: 15, single_father: 2, blended: 3, grandparents: 2, extended_family: 3, foster: 0.5, adoptive: 1.5 }
        mods:
          - when: { household.marriage_quality: separated }
            mul: { two_parents: 0.05, single_mother: 4, single_father: 3, blended: 3, grandparents: 3 }
          - note: A stable marriage rarely produces a single-parent home (parent death only).
            when: { household.marriage_quality: [warm_stable, cold_stable] }
            mul: { single_mother: 0.05, single_father: 0.05, blended: 0.05 }
          - when: { household.marriage_quality: [strained, high_conflict] }
            mul: { single_mother: 0.4, single_father: 0.4, blended: 0.4 }
          - when: { household.marriage_quality: high_conflict }
            mul: { two_parents: 0.9 }
          - when: { any_parent.age_at_birth: under_20 }
            mul: { single_mother: 2.5, grandparents: 4 }
          - when: { context.norms_family: extended }
            mul: { extended_family: 4 }
          - when: { year: ">=1995" }
            mul: { single_mother: 1.2 }
          - when: { any_parent.practice: [devout, strict] }
            mul: { two_parents: 1.3 }
          - when: { any_parent.substance_use: drug_dependence }
            mul: { foster: 5, grandparents: 2 }

      - id: planned
        values: [planned, unplanned_welcomed, unplanned_resented]
        weights: { planned: 55, unplanned_welcomed: 35, unplanned_resented: 10 }
        mods:
          - when: { any_parent.age_at_birth: under_20 }
            mul: { planned: 0.2, unplanned_resented: 2.5 }
          - when: { any_parent.age_at_birth: 20_24 }
            mul: { planned: 0.7 }
          - when: { household.wealth: poverty }
            mul: { unplanned_resented: 1.5 }
          - when: { any_parent.practice: [devout, strict] }
            mul: { unplanned_welcomed: 1.5 }

      - id: siblings
        values: ["0", "1", "2", "3", "4", "5_plus"]
        weights: { "0": 20, "1": 38, "2": 24, "3": 10, "4": 5, "5_plus": 3 }
        mods:
          - when: { any_parent.religion: latter_day_saint }
            mul: { "0": 0.4, "3": 3, "4": 3, "5_plus": 3 }
          - when: { any_parent.practice: [devout, strict] }
            mul: { "3": 2, "4": 2, "5_plus": 2 }
          - when: { year: ">=1995" }
            mul: { "0": 1.3, "3": 0.7, "4": 0.7, "5_plus": 0.7 }
          - when: { context.urbanicity: urban_core }
            mul: { "0": 1.4 }
          - when: { household.wealth: poverty }
            mul: { "4": 1.5, "5_plus": 1.5 }

      - id: birth_order
        values: [only, eldest, middle, youngest]
        weights: { only: 0 }
        only_if: { household.siblings: "!0" }
        default: only
        mods:
          - when: { household.siblings: "1" }
            mul: { middle: 0 }
          - when: { household.siblings: ["3", "4", "5_plus"] }
            mul: { middle: 2 }

      - id: age_gaps
        values: [none, close, moderate, wide]
        weights: { none: 0, close: 45, moderate: 40, wide: 15 }
        only_if: { household.siblings: "!0" }
        default: none
        mods:
          - when: { any_parent.age_at_birth: 40_plus }
            mul: { wide: 2 }
          - when: { household.shape: blended }
            mul: { wide: 3 }

      - id: twin
        values: [single, fraternal_twin, identical_twin]
        weights: { single: 97.5, fraternal_twin: 1.9, identical_twin: 0.6 }
        mods:
          - when: { mother.age_at_birth: [35_39, 40_plus] }
            mul: { fraternal_twin: 1.5 }

      - id: birth_term
        values: [full_term, premature, very_premature]
        weights: { full_term: 89, premature: 9, very_premature: 2 }
        mods:
          - when: { household.wealth: poverty }
            mul: { premature: 1.4, very_premature: 1.5 }
          - when: { mother.age_at_birth: [under_20, 40_plus] }
            mul: { premature: 1.4 }
          - when: { household.twin: "!single" }
            mul: { premature: 5, very_premature: 3 }

  # ------------------------------------------------------------ surroundings
  - name: surroundings
    items:

      - id: neighborhood_wealth
        values: [poor, working_class, middle, affluent, wealthy]
        mods:
          - when: { household.wealth: poverty }
            mul: { poor: 8, working_class: 4, middle: 1, affluent: 0.1, wealthy: 0.02 }
          - when: { household.wealth: working_class }
            mul: { poor: 3, working_class: 6, middle: 3, affluent: 0.3, wealthy: 0.05 }
          - when: { household.wealth: lower_middle }
            mul: { poor: 1, working_class: 4, middle: 6, affluent: 1, wealthy: 0.1 }
          - when: { household.wealth: upper_middle }
            mul: { poor: 0.2, working_class: 1, middle: 6, affluent: 4, wealthy: 0.5 }
          - when: { household.wealth: affluent }
            mul: { poor: 0.05, working_class: 0.3, middle: 2, affluent: 6, wealthy: 2 }
          - when: { household.wealth: wealthy }
            mul: { poor: 0.01, working_class: 0.05, middle: 0.5, affluent: 3, wealthy: 8 }

      - id: safety
        values: [dangerous, rough, average, safe, very_safe]
        weights: { dangerous: 1, rough: 2, average: 4, safe: 3, very_safe: 1 }
        mods:
          - when: { surroundings.neighborhood_wealth: poor }
            mul: { dangerous: 6, rough: 4, safe: 0.3, very_safe: 0.1 }
          - when: { surroundings.neighborhood_wealth: working_class }
            mul: { dangerous: 1.5, rough: 2, very_safe: 0.4 }
          - when: { surroundings.neighborhood_wealth: [affluent, wealthy] }
            mul: { dangerous: 0.05, rough: 0.2, safe: 2, very_safe: 4 }
          - when: { context.urbanicity: [small_town, rural] }
            mul: { dangerous: 0.4, very_safe: 1.5 }

      - id: housing
        values: [unstable_or_shelter, public_housing, rented_apartment, rented_house, owned_apartment, owned_house, farm, estate]
        weights: { unstable_or_shelter: 1, public_housing: 4, rented_apartment: 25, rented_house: 12, owned_apartment: 8, owned_house: 45, farm: 3, estate: 0.5 }
        mods:
          - when: { context.urbanicity: urban_core }
            mul: { rented_apartment: 3, owned_apartment: 4, owned_house: 0.2, rented_house: 0.4, farm: 0 }
          - when: { context.urbanicity: [small_town, rural] }
            mul: { farm: 6, rented_apartment: 0.2, owned_apartment: 0.05, public_housing: 0.3 }
          - when: { household.wealth: poverty }
            mul: { unstable_or_shelter: 6, public_housing: 4, owned_house: 0.2, owned_apartment: 0.2, estate: 0 }
          - when: { household.wealth: working_class }
            mul: { public_housing: 1.5, owned_house: 0.6, estate: 0 }
          - when: { household.wealth: [affluent, wealthy] }
            mul: { unstable_or_shelter: 0, public_housing: 0, rented_apartment: 0.3, rented_house: 0.3, owned_house: 1.5 }
          - when: { household.wealth: wealthy }
            mul: { estate: 20 }

      - id: school_quality
        values: [failing, below_average, average, good, elite]
        weights: { failing: 1, below_average: 3, average: 5, good: 3, elite: 0.3 }
        mods:
          - when: { surroundings.neighborhood_wealth: poor }
            mul: { failing: 5, below_average: 2, good: 0.3, elite: 0.05 }
          - when: { surroundings.neighborhood_wealth: working_class }
            mul: { failing: 1.5, below_average: 1.5, good: 0.6, elite: 0.2 }
          - when: { surroundings.neighborhood_wealth: affluent }
            mul: { failing: 0.1, below_average: 0.3, good: 2.5, elite: 3 }
          - when: { surroundings.neighborhood_wealth: wealthy }
            mul: { failing: 0.02, below_average: 0.1, good: 3, elite: 10 }

      - id: school_type
        values: [public, charter, private_secular, religious, boarding, homeschool]
        weights: { public: 78, charter: 5, private_secular: 5, religious: 9, boarding: 0.5, homeschool: 2.5 }
        mods:
          - when: { household.wealth: [affluent, wealthy] }
            mul: { private_secular: 5, boarding: 6 }
          - when: { any_parent.practice: [devout, strict] }
            mul: { religious: 3, homeschool: 3 }
          - when: { any_parent.religion: [catholic, jewish] }
            mul: { religious: 2 }
          - when: { context.urbanicity: rural }
            mul: { charter: 0.3, private_secular: 0.3, homeschool: 1.5 }
          - when: { context.urbanicity: urban_core }
            mul: { charter: 2 }
          - when: { year: "<1992" }
            mul: { charter: 0 }

      - id: activities
        values: [none, few, some, many]
        weights: { none: 10, few: 30, some: 40, many: 20 }
        mods:
          - when: { household.wealth: [poverty, working_class] }
            mul: { none: 2.5, few: 1.5, many: 0.3 }
          - when: { household.wealth: [affluent, wealthy] }
            mul: { none: 0.2, many: 3 }
          - when: { surroundings.neighborhood_wealth: [affluent, wealthy] }
            mul: { many: 1.5 }
          - when: { context.urbanicity: rural }
            mul: { many: 0.5, none: 1.5 }

  # ------------------------------------------------------------ home climate
  - name: climate
    items:

      - id: parenting_style
        values: [warm_and_firm, strict, permissive, neglectful, overprotective, inconsistent]
        weights: { warm_and_firm: 32, strict: 20, permissive: 14, neglectful: 8, overprotective: 12, inconsistent: 14 }
        mods:
          - when: { any_parent.mental_health_severity: [moderate, severe] }
            mul: { inconsistent: 2, neglectful: 2, warm_and_firm: 0.6 }
          - when: { any_parent.substance_use: [alcohol_dependence, drug_dependence] }
            mul: { neglectful: 3, inconsistent: 2, warm_and_firm: 0.4 }
          - when: { any_parent.education: [bachelors, masters, doctorate_professional] }
            mul: { warm_and_firm: 1.4 }
          - when: { any_parent.practice: [devout, strict] }
            mul: { strict: 2 }
          - when: { household.wealth: poverty }
            mul: { strict: 1.3, neglectful: 1.4 }
          - note: Children shape how their parents treat them (spec step 3).
            when: { pawn.threat_sensitivity: ">=0.7" }
            mul: { overprotective: 2 }
          - note: Children shape how their parents treat them (spec step 3).
            when: { pawn.reward_drive: ">=0.7", pawn.self_control: "<=0.3" }
            mul: { strict: 2 }

      - id: domestic_violence
        values: [none, verbal, physical_between_parents, physical_toward_children]
        weights: { none: 78, verbal: 14, physical_between_parents: 5, physical_toward_children: 3 }
        mods:
          - when: { any_parent.substance_use: [alcohol_dependence, drug_dependence] }
            mul: { verbal: 2, physical_between_parents: 3, physical_toward_children: 3 }
          - when: { household.marriage_quality: high_conflict }
            mul: { verbal: 3, physical_between_parents: 4 }
          - when: { household.marriage_quality: warm_stable }
            mul: { verbal: 0.2, physical_between_parents: 0.2, physical_toward_children: 0.2 }
          - when: { any_parent.mental_health_severity: severe }
            mul: { verbal: 1.5, physical_between_parents: 1.5, physical_toward_children: 1.5 }

      - id: caregiving_duties
        values: [none, light_chores, sibling_care, parent_care, acting_head_of_household]
        weights: { none: 25, light_chores: 55, sibling_care: 12, parent_care: 4, acting_head_of_household: 1 }
        mods:
          - when: { household.shape: [single_mother, single_father] }
            mul: { sibling_care: 2.5, acting_head_of_household: 3 }
          - when: { household.birth_order: eldest }
            mul: { sibling_care: 3 }
          - when: { household.birth_order: only }
            mul: { sibling_care: 0 }
          - when: { any_parent.mental_health_severity: severe }
            mul: { parent_care: 4, acting_head_of_household: 3 }
          - when: { any_parent.substance_use: [alcohol_dependence, drug_dependence] }
            mul: { parent_care: 2, acting_head_of_household: 3 }
          - when: { household.wealth: [affluent, wealthy] }
            mul: { none: 2.5, sibling_care: 0.5 }

  # --------------------------------------------------------------- identity
  - name: identity
    note: The pawn's own traits that are set before life begins. Orientation decides who the pawn dates in the life simulation and who it can pair with in the city.
    items:

      - id: orientation
        note: PLACEHOLDER shares, not researched. Younger cohorts identify as bisexual more often; women more often bisexual, men more often gay.
        values: [straight, bisexual, gay]
        weights: { straight: 90, bisexual: 6.5, gay: 3.5 }
        mods:
          - when: { year: ">=1990" }
            mul: { bisexual: 1.6 }
          - when: { pawn.sex: female }
            mul: { bisexual: 1.6, gay: 0.6 }
